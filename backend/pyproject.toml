[project]
name = "backend"
version = "0.1.0"
description = "Backend ASGI del MVP de Tenda"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]==5.6.3",
    "django==5.2.17",
    "graphene-django==3.2.3",
    "gunicorn==26.2.0",
    "psycopg[binary]==3.3.4",
    "redis==6.4.0",
    "uvicorn[standard]==0.52.4",
    "uvicorn-worker==0.4.0",
    "django-cors-headers==4.9.0",
    "whitenoise==6.12.0",
    "argon2-cffi==25.1.0",
    "django-redis==7.0.0",
    "cryptography==50.0.0",
    "django-celery-beat==2.9.0",
    "boto3==1.43.79",
    "httpx==0.28.1",
    "sentry-sdk[django]==2.68.1",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.0",
    "factory-boy==3.3.3",
    "mypy==1.18.2",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.4",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tenda.settings.local"
addopts = "-ra --strict-config --strict-markers"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["(^|/)migrations/", "^tests/"]

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "django_celery_beat",
    "django_celery_beat.*",
    "graphene",
    "graphene.*",
    "graphene_django",
    "graphene_django.*",
    "reportlab",
    "reportlab.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.django-stubs]
django_settings_module = "tenda.settings.local"
