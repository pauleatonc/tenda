mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    profile {
      id
      fullName
      phone
      locale
      photoUrl
    }
  }
}

mutation UpdateOrganisation($input: UpdateOrganisationInput!) {
  updateOrganisation(input: $input) {
    organisation {
      id
      name
      timezone
      phone
      businessEmail
      address
      description
      logoUrl
      bankName
      bankAccountType
      bankAccountNumber
      bankHolderTaxId
      bankConfirmationEmail
      hasBankDetails
      bankAccounts {
        id
        label
        bankName
        bankAccountType
        bankAccountNumber
        bankHolderTaxId
        bankConfirmationEmail
        position
      }
    }
  }
}

mutation ReplaceBankAccounts($input: ReplaceBankAccountsInput!) {
  replaceBankAccounts(input: $input) {
    organisation {
      id
      hasBankDetails
      bankAccounts {
        id
        label
        bankName
        bankAccountType
        bankAccountNumber
        bankHolderTaxId
        bankConfirmationEmail
        position
      }
    }
    bankAccounts {
      id
      label
      bankName
      bankAccountType
      bankAccountNumber
      bankHolderTaxId
      bankConfirmationEmail
      position
    }
  }
}
