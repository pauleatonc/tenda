query Viewer {
  viewer {
    id
    email
    emailVerified
    profile {
      id
      fullName
      phone
      locale
      photoUrl
    }
  }
  organisation {
    id
    name
    timezone
    phone
    businessEmail
    address
    description
    logoUrl
    bankName
    bankAccountType
    bankAccountNumber
    bankHolderTaxId
    bankConfirmationEmail
    hasBankDetails
  }
  activeInventory {
    id
    name
  }
  activeMembership {
    id
    role
    roleLabel
    permissions {
      viewFinancials
      manageMembers
      manageSensitiveConfiguration
      manageInventorySchema
    }
  }
}

query OrganisationMembers {
  members {
    id
    email
    fullName
    role
    roleLabel
    permissions {
      viewFinancials
      manageMembers
      manageSensitiveConfiguration
      manageInventorySchema
    }
  }
}

mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    profile {
      id
      fullName
      phone
      locale
      photoUrl
    }
  }
}

mutation UpdateOrganisation($input: UpdateOrganisationInput!) {
  updateOrganisation(input: $input) {
    organisation {
      id
      name
      timezone
      phone
      businessEmail
      address
      description
      logoUrl
      bankName
      bankAccountType
      bankAccountNumber
      bankHolderTaxId
      bankConfirmationEmail
      hasBankDetails
    }
  }
}

mutation AddOrganisationMember($input: AddMemberInput!) {
  addOrganisationMember(input: $input) {
    member {
      id
      email
      fullName
      role
      roleLabel
    }
  }
}

mutation UpdateOrganisationMember($input: UpdateMemberInput!) {
  updateOrganisationMember(input: $input) {
    member {
      id
      email
      fullName
      role
      roleLabel
      permissions {
        viewFinancials
        manageMembers
        manageSensitiveConfiguration
        manageInventorySchema
      }
    }
  }
}

mutation RemoveOrganisationMember($memberId: ID!) {
  removeOrganisationMember(memberId: $memberId) {
    removedMemberId
  }
}
