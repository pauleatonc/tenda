query OrganisationBilling {
  organisationBilling {
    planCode
    planName
    priceClp
    productLimit
    productCount
    remainingSlots
    aiAssistedEnabled
    canCreateProduct
    subscriptionStatus
    cancelAtPeriodEnd
    currentPeriodEnd
    needsPlanSelection
    plans {
      code
      name
      priceClp
      productLimit
      aiAssistedEnabled
      isCurrent
    }
  }
}

mutation StartPlanCheckout(
  $planCode: String!
  $payerEmail: String
  $acceptedTerms: Boolean!
) {
  startPlanCheckout(
    planCode: $planCode
    payerEmail: $payerEmail
    acceptedTerms: $acceptedTerms
  ) {
    initPoint
    planCode
    preapprovalId
  }
}

mutation SelectSignupPlan($planCode: String!, $acceptedTerms: Boolean!) {
  selectSignupPlan(planCode: $planCode, acceptedTerms: $acceptedTerms) {
    organisationBilling {
      planCode
      planName
      priceClp
      productLimit
      productCount
      remainingSlots
      aiAssistedEnabled
      canCreateProduct
      subscriptionStatus
      cancelAtPeriodEnd
      currentPeriodEnd
      needsPlanSelection
      plans {
        code
        name
        priceClp
        productLimit
        aiAssistedEnabled
        isCurrent
      }
    }
  }
}

mutation CancelSubscription {
  cancelSubscription {
    organisationBilling {
      planCode
      planName
      priceClp
      productLimit
      productCount
      remainingSlots
      aiAssistedEnabled
      canCreateProduct
      subscriptionStatus
      cancelAtPeriodEnd
      currentPeriodEnd
      needsPlanSelection
      plans {
        code
        name
        priceClp
        productLimit
        aiAssistedEnabled
        isCurrent
      }
    }
  }
}

mutation ResumeSubscription {
  resumeSubscription {
    organisationBilling {
      planCode
      planName
      priceClp
      productLimit
      productCount
      remainingSlots
      aiAssistedEnabled
      canCreateProduct
      subscriptionStatus
      cancelAtPeriodEnd
      currentPeriodEnd
