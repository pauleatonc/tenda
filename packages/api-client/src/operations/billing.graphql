query OrganisationBilling {
  organisationBilling {
    planCode
    planName
    priceClp
    productLimit
    productCount
    remainingSlots
    aiAssistedEnabled
    canCreateProduct
    subscriptionStatus
    cancelAtPeriodEnd
    currentPeriodEnd
    needsPlanSelection
    plans {
      code
      name
      priceClp
      productLimit
      aiAssistedEnabled
      isCurrent
    }
  }
}

mutation StartPlanCheckout($planCode: String!, $payerEmail: String) {
  startPlanCheckout(planCode: $planCode, payerEmail: $payerEmail) {
    initPoint
    planCode
    preapprovalId
  }
}

mutation SelectSignupPlan($planCode: String!) {
  selectSignupPlan(planCode: $planCode) {
    organisationBilling {
      planCode
      planName
      priceClp
      productLimit
      productCount
      remainingSlots
      aiAssistedEnabled
      canCreateProduct
      subscriptionStatus
      cancelAtPeriodEnd
      currentPeriodEnd
      needsPlanSelection
      plans {
        code
        name
        priceClp
        productLimit
        aiAssistedEnabled
        isCurrent
      }
    }
  }
}

mutation CancelSubscription {
  cancelSubscription {
    organisationBilling {
      planCode
      planName
      priceClp
      productLimit
      productCount
      remainingSlots
      aiAssistedEnabled
      canCreateProduct
      subscriptionStatus
      cancelAtPeriodEnd
      currentPeriodEnd
      needsPlanSelection
      plans {
        code
        name
        priceClp
        productLimit
        aiAssistedEnabled
        isCurrent
      }
    }
  }
}

mutation ResumeSubscription {
  resumeSubscription {
    organisationBilling {
      planCode
      planName
      priceClp
      productLimit
      productCount
      remainingSlots
      aiAssistedEnabled
      canCreateProduct
      subscriptionStatus
      cancelAtPeriodEnd
      currentPeriodEnd
      needsPlanSelection
      plans {
        code
