fragment ShipmentLabel on LabelDocumentType {
  id
  downloadUrl
  expiresAt
  createdAt
  fileName
}

fragment ShipmentSummary on ShipmentType {
  id
  number
  status
  statusLabel
  deliveryMode
  recipientName
  commune
  region
  carrier
  trackingCode
  trackingUrl
  allowedActions
  dispatchedAt
  deliveredAt
  createdAt
  order {
    id
    number
    status
  }
}

fragment ShipmentDetail on ShipmentType {
  ...ShipmentSummary
  recipientTaxId
  addressLine
  deliveryNotes
  dispatchNote
  buyerEmail
  updatedAt
  latestLabel {
    ...ShipmentLabel
  }
}

query ShippingDashboard {
  shippingDashboard {
    total
    pending
    dispatched
    delivered
  }
}

query Shipments($filter: ShipmentFilterInput, $first: Int, $after: String) {
  shipments(filter: $filter, first: $first, after: $after) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...ShipmentSummary
    }
  }
}

query Shipment($id: ID!) {
  shipment(id: $id) {
    ...ShipmentDetail
  }
}

mutation RegisterShipmentDispatch(
  $shipmentId: ID!
  $input: RegisterShipmentDispatchInput!
  $idempotencyKey: String!
) {
  registerShipmentDispatch(
    shipmentId: $shipmentId
    input: $input
    idempotencyKey: $idempotencyKey
  ) {
    replayed
    shipment {
      ...ShipmentDetail
    }
  }
}

mutation GenerateShipmentLabel($shipmentId: ID!, $idempotencyKey: String!) {
  generateShipmentLabel(shipmentId: $shipmentId, idempotencyKey: $idempotencyKey) {
    replayed
    label {
      ...ShipmentLabel
    }
    shipment {
      ...ShipmentDetail
    }
  }
}
