  refundPayment(idempotencyKey: String!, orderId: ID!, reason: String!): RefundPayment!
  resendOrderLink(idempotencyKey: String!, orderId: ID!): ResendOrderLink!
  sendOfferLink(email: String!, idempotencyKey: String!, orderId: ID!): SendOfferLink!
  reissueBankTransferOffer(idempotencyKey: String!, orderId: ID!): ReissueBankTransferOffer!
  retryReconciliation(idempotencyKey: String!, issueId: ID!): RetryReconciliation!
  registerShipmentDispatch(idempotencyKey: String!, input: RegisterShipmentDispatchInput!, shipmentId: ID!): RegisterShipmentDispatch!
  generateShipmentLabel(idempotencyKey: String!, shipmentId: ID!): GenerateShipmentLabel!
  createCustomField(input: CreateCustomFieldInput!): CreateCustomField!
  updateCustomField(input: UpdateCustomFieldInput!): UpdateCustomField!
  reorderCustomFields(fieldIds: [ID!]!): ReorderCustomFields!
  createProduct(input: CreateProductInput!): CreateProduct!
  updateProduct(input: UpdateProductInput!): UpdateProduct!
  recordStockMovement(input: RecordStockMovementInput!): RecordStockMovement!
  archiveProduct(productId: ID!): ArchiveProduct!
  restoreProduct(productId: ID!): RestoreProduct!
  attachProductMedia(assetId: ID!, makePrimary: Boolean, productId: ID!): AttachProductMedia!
  setPrimaryProductMedia(assetId: ID!, productId: ID!): SetPrimaryProductMedia!
  removeProductMedia(assetId: ID!, productId: ID!): RemoveProductMedia!
  startInventoryImport(assetId: ID!): StartInventoryImport!
