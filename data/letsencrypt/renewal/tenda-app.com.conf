# renew_before_expiry = 30 days
version = 4.0.0
archive_dir = /etc/letsencrypt/archive/tenda-app.com
cert = /etc/letsencrypt/live/tenda-app.com/cert.pem
privkey = /etc/letsencrypt/live/tenda-app.com/privkey.pem
chain = /etc/letsencrypt/live/tenda-app.com/chain.pem
fullchain = /etc/letsencrypt/live/tenda-app.com/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = 6dc2a5c7c66a4bd0a824a815da3b5613
authenticator = webroot
webroot_path = /var/www/certbot,
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
[[webroot_map]]
tenda-app.com = /var/www/certbot
www.tenda-app.com = /var/www/certbot
