# Stack local: `docker compose -f infra/compose.yaml up --build`
name: tenda

x-backend: &backend
  image: ${TENDA_BACKEND_IMAGE:-tenda-backend:local}
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-tenda.settings.local}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-insecure-compose-key}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    POSTGRES_DB: ${POSTGRES_DB:-tenda}
    POSTGRES_USER: ${POSTGRES_USER:-tenda}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenda-local}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    REDIS_URL: redis://redis:6379/0
    AGENT_FEATURE_STATUS: coming_soon
    SALES_RESERVATION_TTL_SECONDS: ${SALES_RESERVATION_TTL_SECONDS:-28800}
    TURNSTILE_FAKE_MODE: ${TURNSTILE_FAKE_MODE:-true}
    OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-local}
    MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - private
  volumes:
    - ../backend/apps:/app/apps
    - ../backend/tenda:/app/tenda
    - ../backend/manage.py:/app/manage.py
    - ../backend/media:/app/media

x-frontend: &frontend
  image: ${TENDA_FRONTEND_DEV_IMAGE:-tenda-frontend:local}
  build:
    context: ..
    dockerfile: frontend/Dockerfile.dev
  env_file:
    - path: ../.env
      required: false
  restart: unless-stopped
  networks:
    - private
  volumes:
    - ../package.json:/repo/package.json
    - ../pnpm-workspace.yaml:/repo/pnpm-workspace.yaml
    - ../pnpm-lock.yaml:/repo/pnpm-lock.yaml
    - ../frontend/web:/repo/frontend/web
    - ../frontend/mobile:/repo/frontend/mobile
    - ../packages/api-client:/repo/packages/api-client
    - frontend_node_modules:/repo/node_modules
    - web_node_modules:/repo/frontend/web/node_modules
    - mobile_node_modules:/repo/frontend/mobile/node_modules
    - api_client_node_modules:/repo/packages/api-client/node_modules

services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenda}
      POSTGRES_USER: ${POSTGRES_USER:-tenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenda-local}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - private

  redis:
    image: redis:7.4.5-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'no',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - private

  backend:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        'uvicorn',
        'tenda.asgi:application',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--reload',
        '--reload-dir',
        'apps',
        '--reload-dir',
        'tenda',
      ]
    ports:
      - '${TENDA_API_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  celery_worker:
    <<: *backend
    depends_on:
      backend:
        condition: service_healthy
    command:
      [
        'watchfiles',
        '--filter',
        'python',
        'celery -A tenda worker --loglevel=INFO --queues=default,imports,payments',
        '/app/apps',
        '/app/tenda',
      ]

  celery_beat:
    <<: *backend
    depends_on:
      backend:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        'celery',
        '-A',
        'tenda',
        'beat',
        '--loglevel=INFO',
        '--scheduler',
        'django_celery_beat.schedulers:DatabaseScheduler',
      ]

  migrate:
    <<: *backend
    command: ['python', 'manage.py', 'migrate', '--noinput']
    restart: 'no'

  backup:
    image: ${TENDA_BACKUP_IMAGE:-tenda-backup:local}
    build:
      context: ..
      dockerfile: infra/backup/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenda}
      POSTGRES_USER: ${POSTGRES_USER:-tenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenda-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['backup-postgres']
    read_only: true
    tmpfs:
      - /work
      - /tmp
    restart: 'no'
    profiles: [operations]
    networks:
      - private

  restore:
    extends: backup
    entrypoint: ['restore-postgres']
    volumes:
      - ${BACKUP_AGE_IDENTITY_PATH:-./secrets/backup-age.key}:/run/secrets/backup_age_identity:ro
    environment:
      BACKUP_AGE_IDENTITY_FILE: /run/secrets/backup_age_identity
    profiles: [restore]

  web:
    <<: *frontend
    command:
      ['pnpm', '--filter', '@tenda/web', 'dev', '--host', '0.0.0.0', '--port', '5173']
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    ports:
      - '${TENDA_HTTP_PORT:-5173}:5173'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  mobile:
    <<: *frontend
    command:
      [
        'pnpm',
        '--filter',
        '@tenda/mobile',
        'start',
        '--',
        '--lan',
        '--port',
        '8081',
      ]
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - '${TENDA_METRO_PORT:-8081}:8081'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    stdin_open: true
    tty: true

networks:
  private:

volumes:
  postgres_data:
  frontend_node_modules:
  web_node_modules:
  mobile_node_modules:
  api_client_node_modules:
