name: tenda-dev

services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: tenda.settings.dev
      DJANGO_DEBUG: 'true'
    command:
      [
        'sh',
        '-c',
        'python manage.py migrate && uvicorn tenda.asgi:application --host 0.0.0.0 --port 8000 --reload',
      ]
    ports:
      - '${TENDA_API_PORT:-8000}:8000'

  celery_worker:
    environment:
      DJANGO_SETTINGS_MODULE: tenda.settings.dev

  celery_beat:
    environment:
      DJANGO_SETTINGS_MODULE: tenda.settings.dev

  nginx:
    ports:
      - '${TENDA_HTTP_PORT:-5173}:80'
