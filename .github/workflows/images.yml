name: Publish images

on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            build_args: ''
          - name: backup
            dockerfile: infra/backup/Dockerfile
            build_args: ''

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: local/tenda-${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/tenda-${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}

      - name: Publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}

  web-static:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install and build web
        env:
          VITE_API_URL: ''
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @tenda/web build
          test -f frontend/web/dist/index.html

      - name: Pack web-dist
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tar -C frontend/web/dist -czf "web-dist-${IMAGE_SHA}.tar.gz" .
          printf '%s\n' "${IMAGE_SHA}" >web-dist-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            web-dist-*.tar.gz
            web-dist-sha.txt
          if-no-files-found: error
          retention-days: 14
